name: agent-tui

on: [pull_request, push]

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: corepack enable
      # AppSDK remains a required local governance gate.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:runtime
      - run: node --import tsx --test tests/*/*.spec.ts
      - run: pnpm run check:public-exports
      - run: pnpm run check:clean-install
      - run: pnpm run check:runtime-boundaries
